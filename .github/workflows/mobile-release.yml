name: Mobile Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS Build
        run: |
          pnpm --filter @oe-rifa/mobile eas build \
            -p android \
            --profile production \
            --non-interactive \
            --wait

      - name: Download APK
        run: |
          cd apps/mobile
          BUILD_ID=$(pnpm eas build:list --platform android --status finished --limit 1 --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d)[0].id)}catch{console.error('No builds found')}})")
          pnpm eas build:download --build-id $BUILD_ID --platform android
          mv *.apk app-release.apk 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/app-release.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
